[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataplor-report-review"
version = "0.2.0"
description = "Standardized LLM-assisted review of DataPlor sample reports (chain + dupelex) with transitive-drift safety and production propagation."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "plorbastian", email = "sebastian@dataplor.com"}
]
license = {text = "MIT"}
dependencies = [
    "psycopg2-binary>=2.9",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/plorbastian/dataplor-report-review"

[tool.setuptools.packages.find]
where = ["."]
include = ["dataplor_report_review*"]
